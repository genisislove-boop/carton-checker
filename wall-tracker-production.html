<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Wall Map</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

:root {
  --bg: #17181B; --panel: #1F2124; --panel-2: #24262A; --line: #34363B;
  --text: #F2F0EA; --muted: #9A9C9F; --safety: #F4B400; --safety-dark: #C89200; --danger: #D64545;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; }
#screen { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; min-height: 100vh; }

.storage-banner { background: #3A2A0E; color: var(--safety); font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-align: center; padding: 8px 12px; border-bottom: 1px solid var(--safety-dark); }

.header { margin-bottom: 18px; }
.eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.18em; color: var(--safety); margin-bottom: 4px; }
.title { font-family: 'Archivo Black', sans-serif; font-size: 28px; margin: 0; }

.search-bar { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 18px; }
.search-bar input { background: transparent; border: none; outline: none; color: var(--text); font-size: 15px; flex: 1; font-family: 'Inter', sans-serif; }
.search-bar input::placeholder { color: var(--muted); }

.wall-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wall-tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; text-align: left; cursor: pointer; }
.wall-num { font-family: 'IBM Plex Mono', monospace; color: var(--safety); font-size: 13px; letter-spacing: 0.05em; margin-bottom: 4px; }
.wall-tile-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }

.compass-map { position: relative; padding: 30px 40px; margin-bottom: 20px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; }
.legend { margin-bottom: 16px; }
.legend-summary { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.05em; cursor: pointer; padding: 4px 0; }
.legend-body { font-size: 13px; color: var(--text); line-height: 1.5; padding: 10px 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; margin-top: 6px; }
.compass-label { position: absolute; font-family: 'IBM Plex Mono', monospace; color: var(--muted); font-size: 12px; letter-spacing: 0.08em; }
.compass-n { top: 8px; left: 50%; transform: translateX(-50%); }
.compass-s { bottom: 8px; left: 50%; transform: translateX(-50%); }
.compass-w { left: 8px; top: 50%; transform: translateY(-50%); }
.compass-e { right: 8px; top: 50%; transform: translateY(-50%); }
.compass-strip { display: flex; flex-direction: column; }
.compass-block { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.compass-wall { position: relative; text-align: center; padding: 7px 0; font-family: 'IBM Plex Mono', monospace; color: var(--text); font-weight: 600; font-size: 13px; }
.flag-badge { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.03em; padding: 2px 6px; border-radius: 4px; margin-top: 3px; }
.flag-overflow { background: #E8590C; color: #17181B; }
.flag-old { background: #F4B400; color: #17181B; }
.compass-wall-hl { background: var(--safety); color: #17181B; }
.compass-dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #17181B; box-shadow: 0 0 6px rgba(0,0,0,0.6); transform: translate(-50%, -50%); }
.compass-divider { height: 1px; background: var(--line); margin: 0 10px; }
.compass-gap { border: 1px dashed var(--line); border-radius: 4px; margin: 4px 0; padding: 3px 0; text-align: center; }
.compass-gap-label { font-family: 'IBM Plex Mono', monospace; color: var(--muted); font-size: 9px; letter-spacing: 0.06em; }

.primary-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--safety); color: #17181B; border: none; border-radius: 10px; padding: 15px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; letter-spacing: 0.05em; margin-bottom: 18px; cursor: pointer; }
.primary-btn:active { background: var(--safety-dark); }
.secondary-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 12px; letter-spacing: 0.05em; margin-bottom: 12px; cursor: pointer; }
.secondary-btn:active { background: var(--line); }

.empty-state { padding: 30px 10px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
.empty-title { font-family: 'IBM Plex Mono', monospace; font-size: 13px; margin-bottom: 6px; }

.results { display: flex; flex-direction: column; gap: 8px; }
.result-row { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; text-align: left; width: 100%; }
.swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
.job-no { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px; }
.result-text { flex: 1; min-width: 0; }
.muted { color: var(--muted); font-size: 13px; }
.small { font-size: 12px; }

.icon-btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 7px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.icon-btn.danger { color: var(--danger); }
.icon-btn svg { width: 18px; height: 18px; }

.editor-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.name-input { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; color: var(--text); font-size: 14px; font-family: 'Inter', sans-serif; min-width: 0; }

.chip-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.chip-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.08em; }
.chip { width: 24px; height: 24px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; padding: 0; }
.chip.active { border-color: var(--text); transform: scale(1.1); }
.chip-clear { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; color: var(--muted); padding: 4px; cursor: pointer; }

.photo-list { display: flex; flex-direction: column; gap: 10px; }
.photo-thumb-row { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.photo-thumb { position: relative; width: 64px; height: 64px; border-radius: 6px; overflow: hidden; border: none; padding: 0; cursor: pointer; flex-shrink: 0; }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb-overlay { position: absolute; inset: 0; }
.thumb-dot { position: absolute; width: 6px; height: 6px; border-radius: 2px; transform: translate(-50%, -50%); box-shadow: 0 0 0 1px rgba(0,0,0,0.5); }
.photo-meta { flex: 1; min-width: 0; }
.bay-name { font-weight: 600; font-size: 14px; }

.grid-wrap { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); cursor: crosshair; touch-action: none; }
.bay-photo { width: 100%; display: block; pointer-events: none; user-select: none; }
.marker { position: absolute; border-radius: 5px; transform: translate(-50%, -50%); cursor: grab; touch-action: none; }
.flash-highlight { animation: flash 0.8s ease-in-out 2; }
@keyframes flash { 0%,100% { box-shadow: 0 0 0 2px rgba(23,24,27,0.85); } 50% { box-shadow: 0 0 0 5px var(--safety); } }

.hint { font-size: 12px; color: var(--muted); margin: 10px 0 4px; line-height: 1.5; }

.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: flex-end; z-index: 50; }
.sheet { background: var(--panel); width: 100%; max-width: 480px; margin: 0 auto; border-radius: 16px 16px 0 0; padding: 20px 18px 26px; border: 1px solid var(--line); border-bottom: none; max-height: 88vh; overflow-y: auto; }
.sheet-title { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 12px; }
.job-input { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; margin-bottom: 10px; }
.job-input.secondary { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 14px; }
.job-input.notes { resize: none; }
.suggest-box { display: flex; flex-direction: column; gap: 4px; margin: -4px 0 10px; }
.suggest-item { text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13px; color: var(--text); cursor: pointer; }
.suggest-item:active { background: var(--line); }
.field-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.08em; margin: 12px 0 8px; }
.featured-job-card { display: block; width: 100%; text-align: left; background: var(--panel); border: 2px solid var(--safety); border-radius: 12px; padding: 16px; cursor: pointer; margin-bottom: 4px; }
.featured-job-card:active { background: var(--panel-2); }
.featured-job-header { display: flex; align-items: flex-start; gap: 10px; }
.featured-job-header .swatch { margin-top: 4px; }
.featured-job-header > div:nth-child(2) { flex: 1; }
.featured-job-status { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 700; white-space: nowrap; }
.reason-list { display: flex; flex-direction: column; gap: 4px; }
.reason-item { font-size: 13px; color: var(--text); }
.status-row { display: flex; gap: 8px; margin-bottom: 4px; }
.status-btn { flex: 1; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--muted); cursor: pointer; }
.status-btn-selected { background: var(--panel); border-color: var(--safety); color: var(--text); font-weight: 600; }
.swatch-row { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch-btn { width: 32px; height: 32px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; padding: 0; }
.swatch-btn.selected { border-color: var(--text); transform: scale(1.08); }
.size-row { display: flex; gap: 10px; }
.size-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 11px; cursor: pointer; }
.size-btn.selected { border-color: var(--safety); color: var(--text); }
.size-preview { border-radius: 3px; }
.sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
.clear-btn { display: flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--line); color: var(--danger); border-radius: 8px; padding: 11px 14px; font-size: 13px; cursor: pointer; }
.save-cell-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--safety); color: #17181B; border: none; border-radius: 8px; padding: 11px; font-weight: 600; font-size: 14px; cursor: pointer; }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); color: var(--text); padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 60; font-family: 'IBM Plex Mono', monospace; }
button { font: inherit; color: inherit; }
</style>
</head>
<body>
<div id="banner"></div>
<div id="screen"></div>
<input type="file" id="fileInput" accept="image/*" style="display:none">
<input type="file" id="ocrFileInput" accept="image/*" style="display:none">
<div id="toast" class="toast" style="display:none"></div>

<script>
// ---------------------------------------------------------------------
// Data + storage (localStorage — this file is meant to be opened
// directly in a browser, so it doesn't depend on any host app's APIs)
// ---------------------------------------------------------------------
const COLORS = [
  { name: "Red",    hex: "#D64545" },
  { name: "Orange", hex: "#E8590C" },
  { name: "Yellow", hex: "#F4B400" },
  { name: "Green",  hex: "#2E8B57" },
  { name: "Teal",   hex: "#17A398" },
  { name: "Blue",   hex: "#2F80ED" },
  { name: "Violet", hex: "#8E44AD" },
  { name: "Pink",   hex: "#E84393" },
];
const SIZES = { S: 16, M: 24, L: 34 };
const MAX_IMG_WIDTH = 1000;

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

function lsGet(key) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
  catch { return null; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch { return false; }
}
function lsDelete(key) { try { localStorage.removeItem(key); } catch {} }

function defaultWalls() {
  const walls = Array.from({ length: 8 }, (_, i) => ({ id: uid(), number: i + 1, name: `Wall ${i + 1}`, photoCount: 0, isWall: true }));
  const opens = [
    { id: uid(), number: null, name: "Open A", label: "Open A", photoCount: 0, isWall: false },
    { id: uid(), number: null, name: "Open B", label: "Open B", photoCount: 0, isWall: false },
    { id: uid(), number: null, name: "Open C", label: "Open C", photoCount: 0, isWall: false },
    { id: uid(), number: null, name: "Open D", label: "Open D", photoCount: 0, isWall: false },
  ];
  return [...walls, ...opens];
}

async function fileToDownscaledDataUrl(file) {
  if (typeof createImageBitmap === "function") {
    try {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, MAX_IMG_WIDTH / bitmap.width);
      const w = Math.round(bitmap.width * scale), h = Math.round(bitmap.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
      bitmap.close && bitmap.close();
      return canvas.toDataURL("image/jpeg", 0.82);
    } catch (e) { /* fall through */ }
  }
  const raw = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  const img = await new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = reject;
    im.src = raw;
  });
  if (!img.width || !img.height) throw new Error("Image failed to decode");
  const scale = Math.min(1, MAX_IMG_WIDTH / img.width);
  const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(img, 0, 0, w, h);
  return canvas.toDataURL("image/jpeg", 0.82);
}

let tesseractLoadPromise = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Couldn't load the label scanner. Check your connection and try again."));
    document.head.appendChild(s);
  });
  return tesseractLoadPromise;
}

let tesseractWorkerPromise = null;
let currentProgressHandler = null;
async function getTesseractWorker() {
  await loadTesseract();
  if (!tesseractWorkerPromise) {
    tesseractWorkerPromise = Tesseract.createWorker("eng", 1, {
      logger: (m) => { if (currentProgressHandler && m.status === "recognizing text") currentProgressHandler(m.progress || 0); },
    });
  }
  return tesseractWorkerPromise;
}
async function workerRecognize(worker, dataUrl, onFraction) {
  currentProgressHandler = onFraction || null;
  try {
    return await worker.recognize(dataUrl);
  } finally {
    currentProgressHandler = null;
  }
}

function rotateImageToCanvas(img, degrees, maxWidth) {
  const rad = (degrees * Math.PI) / 180;
  const cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
  // Bounding box of the source rectangle after rotation (works for any angle,
  // and reduces to the old swap-based logic exactly at 0/90/180/270).
  const rotW = img.width * cos + img.height * sin;
  const rotH = img.width * sin + img.height * cos;
  const scale = Math.min(1, maxWidth / rotW);
  const dw = img.width * scale, dh = img.height * scale;
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(rotW * scale));
  canvas.height = Math.max(1, Math.round(rotH * scale));
  const ctx = canvas.getContext("2d");
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(rad);
  ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
  return canvas;
}

function invertCanvas(sourceCanvas) {
  const canvas = document.createElement("canvas");
  canvas.width = sourceCanvas.width; canvas.height = sourceCanvas.height;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(sourceCanvas, 0, 0);
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) { d[i] = 255 - d[i]; d[i + 1] = 255 - d[i + 1]; d[i + 2] = 255 - d[i + 2]; }
  ctx.putImageData(imgData, 0, 0);
  return canvas;
}

function extractLinesFromResult(data, ctx, canvasW, canvasH) {
  const rawLines = (data.lines && data.lines.length ? data.lines : []).length
    ? data.lines
    : (data.paragraphs || []).flatMap((p) => p.lines || []);
  const lines = rawLines
    .map((ln) => {
      const text = (ln.text || "").trim();
      if (!text) return null;
      const bbox = ln.bbox;
      let avgLum = null;
      if (bbox) {
        const x = Math.max(0, Math.floor(bbox.x0)), y = Math.max(0, Math.floor(bbox.y0));
        const w = Math.max(1, Math.min(Math.ceil(bbox.x1 - bbox.x0), canvasW - x));
        const h = Math.max(1, Math.min(Math.ceil(bbox.y1 - bbox.y0), canvasH - y));
        try {
          const pixels = ctx.getImageData(x, y, w, h).data;
          let sum = 0, count = 0;
          for (let i = 0; i < pixels.length; i += 4) { sum += (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3; count++; }
          avgLum = count ? sum / count : null;
        } catch (e) { avgLum = null; }
      }
      return { text, avgLum };
    })
    .filter(Boolean);
  if (lines.length === 0 && data.text) {
    return data.text.split("\n").map((s) => s.trim()).filter(Boolean).map((text) => ({ text, avgLum: null }));
  }
  return lines;
}

async function quickWordScore(worker, canvas) {
  try {
    const { data } = await workerRecognize(worker, canvas.toDataURL("image/jpeg", 0.7));
    const words = (data.words || []).filter((w) => (w.confidence || 0) > 45 && /[A-Za-z0-9]{2,}/.test(w.text || ""));
    return words.length;
  } catch (e) { return -1; }
}

async function loadImageSource(file) {
  if (typeof createImageBitmap === "function") {
    try { return await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch (e) {
      try { return await createImageBitmap(file); } catch (e2) { /* fall through to Image path */ }
    }
  }
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Couldn't read that photo."));
    reader.readAsDataURL(file);
  });
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = () => reject(new Error("Couldn't read that photo."));
    im.src = dataUrl;
  });
}

async function scanLabelText(file, onProgress, onDebugImage) {
  const worker = await getTesseractWorker();
  const img = await loadImageSource(file);
  if (!img.width || !img.height) throw new Error("That photo didn't load right — try again.");

  try {
    // Quickly test all 4 orientations at low resolution to find the upright one,
    // so people don't have to think about how they held the phone.
    if (onProgress) onProgress(5);
    const rotations = [0, 90, 180, 270];
    let bestRotation = 0, bestScore = -1;
    for (let i = 0; i < rotations.length; i++) {
      const deg = rotations[i];
      const smallCanvas = rotateImageToCanvas(img, deg, 700);
      const score = await quickWordScore(worker, smallCanvas);
      if (score > bestScore) { bestScore = score; bestRotation = deg; }
      if (onProgress) onProgress(5 + Math.round(((i + 1) / rotations.length) * 12));
    }

    // Fine-tune around the best cardinal angle to handle a photo that's
    // crooked, not just sideways/upside-down (e.g. a hand-held shot of a
    // label at a 20-30° tilt, which no multiple of 90° can fix on its own).
    const fineOffsets = [-35, -30, -25, -20, -15, -10, -5, 5, 10, 15, 20, 25, 30, 35];
    for (let i = 0; i < fineOffsets.length; i++) {
      const deg = bestRotation + fineOffsets[i];
      const smallCanvas = rotateImageToCanvas(img, deg, 700);
      const score = await quickWordScore(worker, smallCanvas);
      if (score > bestScore) { bestScore = score; bestRotation = deg; }
      if (onProgress) onProgress(17 + Math.round(((i + 1) / fineOffsets.length) * 13));
    }

    // Full-resolution canvas at the winning rotation — used both for OCR and for
    // sampling background luminance (black-bar vs white-bg text detection).
    const canvas = rotateImageToCanvas(img, bestRotation, 1600);
    const ctx = canvas.getContext("2d");
    const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
    if (onDebugImage) onDebugImage(dataUrl, bestRotation, bestScore);

    const passA = await workerRecognize(worker, dataUrl, (frac) => { if (onProgress) onProgress(30 + Math.round(frac * 40)); });
    const linesA = extractLinesFromResult(passA.data, ctx, canvas.width, canvas.height);

    // If the normal pass already caught both target fields, skip the (slower)
    // inverted pass entirely — most labels don't need it.
    const checkA = extractPoAndInstallAt(linesA);
    if (checkA.po && checkA.installAt) {
      if (onProgress) onProgress(100);
      return linesA;
    }

    const invertedDataUrl = invertCanvas(canvas).toDataURL("image/jpeg", 0.9);
    const passB = await workerRecognize(worker, invertedDataUrl, (frac) => { if (onProgress) onProgress(70 + Math.round(frac * 30)); });
    const linesB = extractLinesFromResult(passB.data, ctx, canvas.width, canvas.height);
    if (onProgress) onProgress(100);

    // Merge + dedupe (case-insensitive, whitespace-normalized) across both passes.
    const seen = new Set();
    const merged = [];
    [...linesA, ...linesB].forEach((l) => {
      const key = l.text.toLowerCase().replace(/\s+/g, " ").trim();
      if (!key || seen.has(key)) return;
      seen.add(key);
      merged.push(l);
    });
    return merged;
  } finally {
    if (img.close) img.close();
  }
}

// Isolate exactly two fields off a shipping label:
//  - P.O. number: sits in a black bar with white text, labeled "PO:" (not "REF PO:" / "MO/PO:")
//  - Install At: plain black-on-white text, labeled "INSTALL AT:"
function extractPoAndInstallAt(lines) {
  const DARK = 110, LIGHT = 150;

  function pick(candidates, preferDark) {
    if (candidates.length === 0) return null;
    const withLum = candidates.filter((c) => c.avgLum != null);
    let sorted = preferDark
      ? withLum.filter((c) => c.avgLum < DARK).sort((a, b) => a.avgLum - b.avgLum)
      : withLum.filter((c) => c.avgLum > LIGHT).sort((a, b) => b.avgLum - a.avgLum);
    return (sorted[0] || withLum[0] || candidates[0]);
  }

  const poCandidates = lines.filter(
    (l) => /\bP\.?\s*O\.?\s*:/i.test(l.text) && !/REF\s*P\.?\s*O/i.test(l.text) && !/MO\s*\/?\s*P\.?\s*O/i.test(l.text)
  );
  const poLine = pick(poCandidates, true);
  let po = null;
  if (poLine) {
    const afterLabel = poLine.text.replace(/^.*?\bP\.?\s*O\.?\s*:\s*/i, "").trim();
    const tokenMatch = afterLabel.match(/^[A-Za-z0-9]+(?:[.\-][A-Za-z0-9]+)*/);
    po = tokenMatch ? tokenMatch[0] : afterLabel;
  }

  const installCandidates = lines.filter((l) => /\bINSTALL\s*AT\s*:/i.test(l.text));
  const installLine = pick(installCandidates, false);
  let installAt = null;
  if (installLine) {
    installAt = installLine.text.replace(/^.*?\bINSTALL\s*AT\s*:\s*/i, "").trim();
  }

  return { po, installAt };
}

function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === "style") Object.assign(e.style, v);
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (v !== undefined && v !== null) e.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach((c) => {
    if (c === null || c === undefined || c === false) return;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return e;
}
